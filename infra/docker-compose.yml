version: '3.8'

services:
  coturn:
    image: coturn/coturn:latest
    container_name: velodesk-coturn
    restart: always
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - DETECT_EXTERNAL_IP=yes

  signaling:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: velodesk-signaling
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - TURN_SECRET=${TURN_SECRET:-velodesk_super_secret_turn_key_change_in_production}
      - TURN_REALM=${TURN_REALM:-turn.velodesk.local}
      - STUN_URL=${STUN_URL:-stun:127.0.0.1:3478}
      - TURN_URL=${TURN_URL:-turn:127.0.0.1:3478}
      - TURN_TTL_SECONDS=${TURN_TTL_SECONDS:-86400}
    depends_on:
      - coturn
