# Coturn Configuration for VeloDesk
# RFC 5389 (STUN) and RFC 8656 / RFC 5766 (TURN)

# Listening ports
listening-port=3478
tls-listening-port=443

# UDP Relay dynamic port range
min-port=49152
max-port=65535

# Fingerprint in TURN messages (RFC 5389 mandatory for WebRTC)
fingerprint

# Ephemeral Time-Window HMAC credentials (TURN REST API standard)
use-auth-secret
static-auth-secret=velodesk_super_secret_turn_key_change_in_production
realm=turn.velodesk.local

# Security & Performance hardening
no-tcp-relay
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Verbosity
verbose
log-file=stdout
