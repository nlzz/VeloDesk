[package]
name = "velodesk-viewer"
version = "0.3.0"
description = "VeloDesk Viewer - Remote Support Operator Desktop Client"
authors = ["VeloDesk Team"]
edition = "2021"

[lib]
name = "velodesk_viewer_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
